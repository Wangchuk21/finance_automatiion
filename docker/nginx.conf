server {
    listen 5173;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Allow uploads up to 50 MB (matches backend MAX_UPLOAD_SIZE_MB).
    # Without this nginx defaults to 1 MB and returns an HTML 413 page.
    client_max_body_size 50M;
    client_body_timeout 300s;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_cookie_path /auth/refresh /auth/refresh;
        proxy_cookie_path / /;
        proxy_hide_header Set-Cookie;
        proxy_pass_header Set-Cookie;
        # Large uploads can take a while to parse/import.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    error_page 404 /index.html;
    location = /index.html {
        internal;
    }
}
